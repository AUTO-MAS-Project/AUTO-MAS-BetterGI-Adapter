[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mas-bettergi-adapter"
version = "0.1.0"
description = "BetterGI specialized script adapter for AUTO-MAS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AUTO-MAS Team" }]
keywords = ["auto-mas-plugin", "auto-mas-id:bettergi_adapter"]
dependencies = ["auto-mas-core>5.9.0,<6"]

[project.urls]
Changelog = "https://github.com/AUTO-MAS-Project/AUTO-MAS-BetterGI-Adapter/blob/dev/CHANGELOG.md"
Documentation = "https://github.com/AUTO-MAS-Project/AUTO-MAS-BetterGI-Adapter/blob/dev/README.md"
Homepage = "https://auto-mas.top"
Repository = "https://github.com/AUTO-MAS-Project/AUTO-MAS-BetterGI-Adapter"
Issues = "https://github.com/AUTO-MAS-Project/AUTO-MAS-BetterGI-Adapter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bettergi_adapter = [
    "py.typed",
    "resources/*.json",
    "resources/OneDragon/*.json",
    "resources/MASOneDragon/*.json",
    "resources/MASOneDragon/*.js",
    "ui/*",
    "ui/**/*",
    "i18n/*.json",
]

[tool.auto-mas]
bundled = true
default-enabled = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["bettergi_adapter"]
known-third-party = ["app", "auto_mas_core"]
